name: android_desktop_mode
description: >-
  Detects whether an Android device is running in desktop mode - Samsung DeX,
  ChromeOS, Android desktop windowing or a vendor PC mode - with the raw signals
  behind the verdict and a stream of changes.
version: 0.1.0
repository: https://github.com/esnawapon/android_desktop_mode
issue_tracker: https://github.com/esnawapon/android_desktop_mode/issues
topics:
  - android
  - desktop-mode
  - samsung-dex
  - chromeos
  - multi-window

environment:
  sdk: ^3.13.0
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.esnawapon.android_desktop_mode
        pluginClass: AndroidDesktopModePlugin
